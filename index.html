<html lang="hu">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gyönge Máté – Full-stack webfejlesztő</title>
    <meta name="description" content="Egyedi weboldalak és webalkalmazások vállalkozásoknak és magánszemélyeknek. Megbízható, minőségi munka, megbeszélt határidőre." />
    <meta property="og:title" content="Gyönge Máté – Full-stack webfejlesztő" />
    <meta property="og:description" content="Egyedi weboldalak és webalkalmazások vállalkozásoknak és magánszemélyeknek." />
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
